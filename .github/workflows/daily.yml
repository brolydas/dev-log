name: Daily repository check

on:
  schedule:
    - cron: '47 3 * * *'
    - cron: '53 8 * * *'
    - cron: '11 16 * * *'
  workflow_dispatch:
    inputs:
      check:
        description: Check to run manually
        type: choice
        default: integrity
        options:
          - integrity
          - statistics
          - summary

permissions:
  contents: write

concurrency:
  group: daily-dev-log
  cancel-in-progress: false

jobs:
  daily-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Perform scheduled check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_CHECK: ${{ inputs.check }}
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          import os
          import subprocess

          schedules = {
              "47 3 * * *": "integrity",
              "53 8 * * *": "statistics",
              "11 16 * * *": "summary",
          }
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              check = os.environ["MANUAL_CHECK"]
          else:
              check = schedules[os.environ["SCHEDULE"]]

          day = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          folder = Path("logs")
          folder.mkdir(exist_ok=True)
          log = folder / f"{day}-{check}.md"
          if log.exists():
              print("This check is already recorded today.")
              raise SystemExit(0)

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          if check == "integrity":
              subprocess.run(["git", "fsck", "--no-dangling"], check=True)
              details = "Git object integrity: passed."
          elif check == "statistics":
              tracked = [Path(p) for p in git("ls-files", "-z").split("\0") if p]
              markdown = [p for p in tracked if p.suffix == ".md"]
              for p in markdown:
                  p.read_text(encoding="utf-8")
              details = (
                  f"Tracked files: {len(tracked)}\n\n"
                  f"Markdown files validated as UTF-8: {len(markdown)}\n\n"
                  f"Commit count: {git('rev-list', '--count', 'HEAD')}"
              )
          elif check == "summary":
              results = []
              for task in ("integrity", "statistics"):
                  recorded = (folder / f"{day}-{task}.md").is_file()
                  results.append(f"{task.title()}: {'recorded' if recorded else 'not recorded'}")
              results.append(f"Total prior log files: {len(list(folder.glob('*.md')))}")
              details = "\n\n".join(results)
          else:
              raise ValueError(f"Unknown check: {check}")

          log.write_text(
              f"# {check.title()} check - {day}\n\n"
              f"{details}\n\n"
              "Automatically generated by GitHub Actions.\n",
              encoding="utf-8",
          )
          PY

      - name: Commit and push new log
        run: |
          git config user.name "brolydas"
          git config user.email "176009615+brolydas@users.noreply.github.com"
          git add logs/
          if git diff --cached --quiet; then
            echo "No new log to commit."
          else
            git commit -m "chore: automated repository check"
            git push
          fi
