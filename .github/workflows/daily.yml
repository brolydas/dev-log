name: Daily repository check

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-dev-log
  cancel-in-progress: false

jobs:
  daily-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check repository and record result
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          import subprocess

          day = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          subprocess.run(["git", "fsck", "--no-dangling"], check=True)
          log = Path("logs") / f"{day}.md"
          log.parent.mkdir(exist_ok=True)
          if not log.exists():
              log.write_text(
                  f"# Daily repository check — {day}\n\n"
                  "Git integrity check: passed.\n"
                  "Automatically generated by GitHub Actions.\n",
                  encoding="utf-8",
              )
          PY

      - name: Commit and push
        run: |
          git config user.name "brolydas"
          git config user.email "176009615+brolydas@users.noreply.github.com"
          git add logs/
          if git diff --cached --quiet; then
            echo "Already recorded today."
          else
            git commit -m "chore: automated daily repository check"
            git push
          fi
