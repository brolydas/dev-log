name: Daily repository check

on:
  schedule:
    - cron: '47 3 * * *'
    - cron: '53 8 * * *'
    - cron: '11 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-dev-log
  cancel-in-progress: false

jobs:
  daily-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure automated commit attribution
        run: |
          git config user.name "brolydas"
          git config user.email "176009615+brolydas@users.noreply.github.com"

      - name: Run daily repository audit
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          from collections import Counter
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import hashlib
          import os
          import random
          import subprocess

          day = datetime.now(ZoneInfo("Asia/Kolkata")).date()
          date = day.isoformat()
          folder = Path("logs")
          folder.mkdir(exist_ok=True)

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          checks = [
              "integrity", "statistics", "file-types", "file-sizes",
              "markdown-validation", "workflow-inventory", "references",
              "history", "log-coverage", "log-storage", "source-fingerprints",
              "working-tree",
          ]
          rng = random.Random(f"dev-log-audit-v1:{date}")
          target = rng.choice([12, 11, 9, 7, 10, 8, 5, 13])
          plan = rng.sample(checks, target - 1) + ["summary"]

          limits = {
              "47 3 * * *": (target + 2) // 3,
              "53 8 * * *": (2 * target + 2) // 3,
              "11 16 * * *": target,
          }
          limit = target if os.environ["EVENT_NAME"] == "workflow_dispatch" else limits[os.environ["SCHEDULE"]]
          print(f"Daily automated audit target: {target}; cumulative run target: {limit}")

          def report(check):
              tracked = [Path(p) for p in git("ls-files", "-z").split("\0") if p]
              files = [p for p in tracked if p.is_file() and not p.is_symlink()]
              if check == "integrity":
                  subprocess.run(["git", "fsck", "--no-dangling"], check=True)
                  return "Git object integrity: passed."
              if check == "statistics":
                  return f"Tracked paths: {len(tracked)}\n\nCommit count: {git('rev-list', '--count', 'HEAD')}"
              if check == "file-types":
                  counts = Counter(p.suffix or "(no extension)" for p in tracked)
                  return "\n".join(f"- {ext}: {count}" for ext, count in sorted(counts.items())) or "No tracked paths."
              if check == "file-sizes":
                  return f"Tracked regular files: {len(files)}\n\nTotal bytes: {sum(p.stat().st_size for p in files)}\n\nLargest file bytes: {max((p.stat().st_size for p in files), default=0)}"
              if check == "markdown-validation":
                  markdown = [p for p in files if p.suffix.lower() == ".md"]
                  for p in markdown:
                      p.read_text(encoding="utf-8")
                  return f"Markdown files successfully decoded as UTF-8: {len(markdown)}"
              if check == "workflow-inventory":
                  workflows = [p for p in tracked if p.parent == Path(".github/workflows") and p.suffix in (".yml", ".yaml")]
                  return f"Tracked workflow files: {len(workflows)}"
              if check == "references":
                  refs = git("for-each-ref", "--format=%(refname)")
                  return f"Git references: {len(refs.splitlines())}"
              if check == "history":
                  recent = git("rev-list", "--count", "--since=7 days ago", "HEAD")
                  return f"Commits in the last seven days: {recent}"
              if check == "log-coverage":
                  prior_days = [(day - timedelta(days=i)).isoformat() for i in range(1, 8)]
                  covered = sum(any(folder.glob(f"{d}*.md")) for d in prior_days)
                  return f"Previous seven days with at least one audit log: {covered}/7"
              if check == "log-storage":
                  logs = list(folder.glob("*.md"))
                  return f"Log files: {len(logs)}\n\nLog storage bytes: {sum(p.stat().st_size for p in logs)}"
              if check == "source-fingerprints":
                  digest = hashlib.sha256()
                  sources = sorted(p for p in files if not p.is_relative_to(folder))
                  for p in sources:
                      digest.update(str(p).encode("utf-8") + b"\0")
                      digest.update(hashlib.sha256(p.read_bytes()).digest())
                  return f"Non-log files fingerprinted: {len(sources)}\n\nCombined SHA-256: {digest.hexdigest()}"
              if check == "working-tree":
                  dirty = git("status", "--porcelain")
                  return f"Working tree clean before report: {'yes' if not dirty else 'no'}"
              if check == "summary":
                  completed = sorted(p.name for p in folder.glob(f"{date}*.md"))
                  return f"Daily audit target: {target}\n\nReports present before summary: {len(completed)}\n\n" + "\n".join(f"- {p}" for p in completed)
              raise ValueError(check)

          for check in plan:
              if len(list(folder.glob(f"{date}*.md"))) >= limit:
                  break
              log = folder / f"{date}-{check}.md"
              if log.exists():
                  continue
              details = report(check)
              log.write_text(
                  f"# {check} - {date}\n\n{details}\n\n"
                  "Automatically generated by GitHub Actions. Not a manual development contribution.\n",
                  encoding="utf-8",
              )
              subprocess.run(["git", "add", "--", str(log)], check=True)
              subprocess.run(["git", "commit", "-m", f"chore(audit): automated {check} report"], check=True)

          print(f"Reports recorded today: {len(list(folder.glob(f'{date}*.md')))}")
          PY

      - name: Push audit commits
        run: git push
